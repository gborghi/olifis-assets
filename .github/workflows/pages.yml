# Publishes the figure assets to GitHub Pages from main.
# actions/deploy-pages caps its wait at 10 min and then CANCELS the deployment, while
# GitHub can stay in "syncing_files" longer for this ~600 MB / ~8700-file site.
# Same official Pages deployment API (OIDC + artifact), but polled for up to 50 min
# without cancelling.
name: Deploy assets to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: https://gborghi.github.io/olifis-assets/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy (long poll, no auto-cancel)
        uses: actions/github-script@v7
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const oidc = await core.getIDToken();
            const r = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: context.sha,
              oidc_token: oidc,
            });
            const id = r.data.id || context.sha;
            core.info(`Created deployment ${id}`);
            const t0 = Date.now(); let last = '';
            while (Date.now() - t0 < 50 * 60 * 1000) {
              await new Promise(res => setTimeout(res, 15000));
              let s;
              try {
                s = (await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', {owner, repo, id})).data.status;
              } catch (e) { core.info(`status error: ${e.status} ${e.message}`); continue; }
              if (s !== last) { core.info(`${Math.round((Date.now()-t0)/1000)}s status: ${s}`); last = s; }
              if (s === 'succeed') return;
              if (['deployment_failed','deployment_content_failed','deployment_cancelled','deployment_lost','deployment_perms_error','deployment_attempt_error'].includes(s)) {
                core.setFailed(`Pages deployment ended with ${s}`); return;
              }
            }
            core.setFailed('Pages deployment still not finished after 50 min');
